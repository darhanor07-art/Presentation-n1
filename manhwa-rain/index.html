:root{--u:1px;--night:#141B26;--slate:#26313F;--steel:#3D4C5E;--rain:#6E89A3;--mist:#C5D0DA;--paper:#EEF1F2;--yel:#F2C230;--prog:0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0b1017;color:var(--paper);overscroll-behavior:none}
body{min-height:100vh}
#stage{position:fixed;left:50%;top:0;transform:translateX(-50%);overflow:hidden;background:#0b1017;box-shadow:0 0 80px rgba(110,137,163,.28)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#ui{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#spacer{width:1px}
#prog{position:absolute;right:calc(5*var(--u));top:6%;bottom:6%;width:calc(2*var(--u));background:rgba(197,208,218,.15);border-radius:2px}
#prog i{position:absolute;left:0;right:0;top:0;height:calc(var(--prog)*100%);background:rgba(197,208,218,.7);border-radius:2px}
#loader{position:fixed;inset:0;z-index:9;background:#0b1017;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .8s;font:italic 600 26px 'Cormorant Garamond',serif;color:var(--mist)}
#loader.done{opacity:0;pointer-events:none}
#loader .lb{width:140px;height:2px;background:rgba(197,208,218,.2);overflow:hidden}
#loader .lb i{display:block;height:100%;width:40%;background:var(--rain);animation:ld 1.1s infinite}
@keyframes ld{from{margin-left:-40%}to{margin-left:100%}}

.it{position:absolute;font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:600;will-change:transform,opacity;opacity:0;visibility:hidden}
.it .tx{position:relative;text-align:center;line-height:1.14}
.it .wd{display:inline-block;will-change:transform,opacity,filter}
.it .wg{display:inline-block;white-space:nowrap}
.it .lt{display:inline-block;will-change:transform,opacity}
.it .ln{display:block;will-change:transform,opacity}

/* narration caption: slate translucent box, thin mist border */
.cap{background:linear-gradient(180deg,rgba(38,49,63,.82),rgba(20,27,38,.88));color:var(--paper);border:calc(1*var(--u)) solid rgba(197,208,218,.7);outline:calc(1*var(--u)) solid rgba(197,208,218,.22);outline-offset:calc(-6*var(--u));box-shadow:0 calc(6*var(--u)) calc(22*var(--u)) rgba(5,8,12,.6);display:flex;align-items:center;justify-content:center;padding:calc(15*var(--u)) calc(20*var(--u));font-size:calc(25*var(--u));text-shadow:0 calc(1*var(--u)) calc(4*var(--u)) rgba(5,8,12,.8)}

/* bubbles: paper white, cool shadow */
.bub,.thought,.shock{display:flex;align-items:center;justify-content:center;color:#141B26;font-size:calc(24*var(--u))}
.bg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 calc(4*var(--u)) calc(9*var(--u)) rgba(10,16,26,.55))}
.bg .fill{fill:#EEF1F2;stroke:#26313F;stroke-width:1.3;vector-effect:non-scaling-stroke}
.bg .fillo{fill:#EEF1F2;stroke:none}
.bg .stk{fill:none;stroke:#26313F;stroke-width:1.3;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.thought .bg{filter:drop-shadow(0 0 calc(7*var(--u)) rgba(197,208,218,.7)) blur(calc(.5*var(--u)))}
.thought .bg .fill{fill:rgba(226,232,237,.94);stroke:rgba(61,76,94,.6);stroke-width:1}
.thought .bg .fz{fill:none;stroke:rgba(197,208,218,.9);stroke-width:calc(7*var(--u));stroke-dasharray:calc(1*var(--u)) calc(3*var(--u));vector-effect:non-scaling-stroke;transform:scale(1.05);transform-origin:50px 32px}
.bub .tx,.thought .tx{padding:0 11%}
.shock{font-size:calc(46*var(--u));font-weight:700}
.shock .bg .fill{fill:#F4F6F7;stroke:#141B26;stroke-width:2}
.shock .tx{font-style:normal;letter-spacing:calc(2*var(--u))}

.sfx{color:rgba(197,208,218,.95);font-size:calc(44*var(--u));letter-spacing:calc(3*var(--u));text-shadow:0 0 calc(12*var(--u)) rgba(110,137,163,.9),0 calc(2*var(--u)) calc(8*var(--u)) rgba(5,8,12,.8);font-weight:600}
.sfx.big{font-size:calc(90*var(--u))}
.title{font-size:calc(70*var(--u));text-align:center;color:var(--paper);text-shadow:0 0 calc(26*var(--u)) rgba(110,137,163,.95),0 calc(3*var(--u)) calc(14*var(--u)) rgba(5,8,12,.85);line-height:1}
.hint{font-size:calc(22*var(--u));letter-spacing:calc(3*var(--u));color:rgba(197,208,218,.9);text-shadow:0 0 calc(10*var(--u)) rgba(5,8,12,.9)}
.hint .tx:after{content:'';display:block;width:calc(10*var(--u));height:calc(10*var(--u));margin:calc(12*var(--u)) auto 0;border-right:calc(2*var(--u)) solid var(--mist);border-bottom:calc(2*var(--u)) solid var(--mist);transform:translateY(calc(var(--bob,0)*7*var(--u))) rotate(45deg)}
.end{font-size:calc(56*var(--u));font-weight:600;color:var(--paper);text-shadow:0 0 calc(16*var(--u)) rgba(110,137,163,.95);transform-origin:left}
.end .tx{display:inline-block;transform:skewX(-6deg);letter-spacing:calc(1*var(--u));padding:0 calc(6*var(--u))}

/* big letter-by-letter lines: no box */
.cap.big{background:radial-gradient(ellipse at center,rgba(10,14,20,.78),rgba(10,14,20,0) 74%);border:0;outline:0;box-shadow:none;color:var(--paper);font-weight:700;font-size:calc(54*var(--u));line-height:1.08;padding:calc(10*var(--u))}
.cap.big.s{font-size:calc(40*var(--u))}
.cap.big .tx{text-shadow:0 calc(2*var(--u)) calc(10*var(--u)) rgba(5,8,12,.9)}
/* off-screen voice: square bubble with dashed vertical edges, no tail */
.voice{color:#141B26;font-weight:700;font-size:calc(27*var(--u))}
.voice .bg .fill{fill:#E3E9ED;stroke:#141B26;stroke-width:2}
.voice .bg .dash{fill:none;stroke:#141B26;stroke-width:2;stroke-dasharray:4 3;vector-effect:non-scaling-stroke}
.voice .tx{padding:0 6%}
.end .pen{position:absolute;width:calc(14*var(--u));height:calc(14*var(--u));margin:calc(-7*var(--u)) 0 0 calc(-7*var(--u));border-radius:50%;background:radial-gradient(circle,#fff 0,rgba(197,208,218,.95) 30%,rgba(110,137,163,0) 72%);box-shadow:0 0 calc(18*var(--u)) calc(7*var(--u)) rgba(110,137,163,.85);opacity:0}

</style>
</head>

<script>/* engine.js */
/* engine.js — scroll-scrubbed Canvas2D compositor for «Тоқтамайтын жаңбыр».
   Pipeline per frame: scene(s) -> offscreen buffers A/B -> transition compose -> post (grade, bloom, vignette, grain)
   -> DOM overlay (captions / bubbles, own parallax, text animations). Deterministic: await MS.render(sVH, tSec).
   Assets (painted with p5.brush, see ../paint) are looked up by exact manifest key and decoded lazily (scene ± 1). */
(function () {
  'use strict';
  const MS = window.MS = window.MS || {};
  const CAP = /[?&]capture=1/.test(location.search);
  const TAU = Math.PI * 2;
  const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
  const lerp = (a, b, t) => a + (b - a) * t;
  const sm = x => { x = clamp(x); return x * x * (3 - 2 * x); };
  const eo = x => { x = clamp(x); return 1 - Math.pow(1 - x, 3); };
  const mod = (a, b) => ((a % b) + b) % b;
  const m = MS.m = { clamp, lerp, sm, eo, mod, TAU };
  function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  MS.rng = rng;
  MS.hash = str => { let h = 7; for (let i = 0; i < str.length; i++) h = Math.imul(h * 31 + str.charCodeAt(i), 2654435761) >>> 0; return h; };
  const mkc = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
  MS.mkc = mkc;
  MS.C = { night: '#141B26', slate: '#26313F', steel: '#3D4C5E', rain: '#6E89A3', mist: '#C5D0DA', paper: '#EEF1F2', yel: '#F2C230', dim: '#C9962A', cy: '#5FD3C0' };

  /* ---------------- viewport state ---------------- */
  let W = 720, H = 1280, u = 1, cw = 720, ch = 1280, DPR = 1;
  const V = MS.V = { get W() { return W; }, get H() { return H; }, get u() { return u; } };

  /* ---------------- assets: manifest by exact key, lazy decode ---------------- */
  const SRC = {}, DEC = {}, PEND = {}, SOFT = {}, SPOT = {};
  function indexAssets() { ((window.__MS_ASSETS || { assets: [] }).assets || []).forEach(a => { SRC[a.name] = a; }); }
  function decode(name) {
    if (DEC[name] || !SRC[name]) return Promise.resolve();
    if (PEND[name]) return PEND[name];
    return PEND[name] = (async () => {
      const img = new Image(); img.src = SRC[name].data;
      try { await img.decode(); DEC[name] = img; } catch (e) { console.warn('decode failed', name); }
      delete PEND[name];
    })();
  }
  const keysOf = i => (MS.scenes[i] && MS.scenes[i].keys) || [];
  let wantSet = new Set();
  function ensureIdx(a, b) {                     // decode scene ± 1 neighbour, release the rest
    const want = new Set(); const lo = Math.max(0, Math.min(a, b < 0 ? a : b) - 1), hi = Math.min(MS.scenes.length - 1, Math.max(a, b) + 1);
    for (let i = lo; i <= hi; i++) keysOf(i).forEach(k => want.add(k));
    wantSet = want;
    for (const k of Object.keys(DEC)) if (!want.has(k)) { delete DEC[k]; delete SOFT[k]; delete SPOT[k]; }
    return Promise.all([...want].map(decode));
  }
  MS.real = name => DEC[name] || null;
  MS.has = name => !!SRC[name];
  MS.img = name => DEC[name] || (MS.ph ? MS.ph(name) : mkc(8, 8));
  MS.eyeImg = MS.img;
  MS.usingPlaceholders = () => {
    const out = [], seen = new Set();
    (MS.scenes || []).forEach(sc => (sc.keys || []).forEach(k => { if (!seen.has(k)) { seen.add(k); if (!SRC[k]) out.push(k); } }));
    return out;
  };

  /* ---------------- drawing helpers ---------------- */
  const filt = (c, s) => { if (MS.hasFilter) c.filter = s || 'none'; };
  MS.filt = filt;
  MS.coverInto = function (c, img, x, y, w, h, zoom, ox, oy) {
    const iw = img.width, ih = img.height, sc = Math.max(w / iw, h / ih) * (zoom || 1), dw = iw * sc, dh = ih * sc;
    c.drawImage(img, x + (w - dw) / 2 + (ox || 0), y + (h - dh) / 2 + (oy || 0), dw, dh);
  };
  /* blurred stand-in: image downscaled by div (bilinear upscale = soft focus, no ctx.filter cost) */
  MS.soft = function (key, div) {
    const img = MS.img(key), id = key + '|' + div + '|' + (DEC[key] ? 1 : 0), hit = SOFT[id]; if (hit) return hit;
    const c = mkc(Math.max(4, Math.round(img.width / div)), Math.max(4, Math.round(img.height / div))), g = c.getContext('2d');
    g.imageSmoothingQuality = 'high'; g.drawImage(img, 0, 0, c.width, c.height); return SOFT[id] = c;
  };
  /* parallax plate / layer. o: {z zoom, fx,fy focus 0..1 (0.5 centred), dx,dy px, a alpha, focus 0..1 (0 = soft), div, softA overlay of the soft copy, mode 'width'}
     returns mapping image(0..1)->screen px */
  MS.layer = function (c, key, o) {
    o = o || {}; const img = MS.img(key), iw = img.width, ih = img.height;
    const sc = (o.mode === 'width' ? W / iw : Math.max(W / iw, H / ih)) * (o.z || 1), dw = iw * sc, dh = ih * sc;
    let x = -(dw - W) * (o.fx == null ? .5 : o.fx) + (o.dx || 0), y = -(dh - H) * (o.fy == null ? .5 : o.fy) + (o.dy || 0);
    x = dw >= W ? clamp(x, W - dw, 0) : (W - dw) / 2; y = dh >= H ? clamp(y, H - dh, 0) : y;
    c.save(); const a = o.a == null ? 1 : o.a;
    if (o.focus != null && o.focus < .999) { const sf = MS.soft(key, o.div || 10); c.globalAlpha = a; c.drawImage(sf, x, y, dw, dh); c.globalAlpha = a * sm(o.focus); c.drawImage(img, x, y, dw, dh); }
    else { c.globalAlpha = a; c.drawImage(img, x, y, dw, dh); if (o.softA) { c.globalAlpha = a * o.softA; c.drawImage(MS.soft(key, o.div || 10), x, y, dw, dh); } }
    c.restore();
    return { x: fx => x + fx * dw, y: fy => y + fy * dh, sc, dw, dh, x0: x, y0: y };
  };
  /* sprite. o: {x,y anchor px, w|h px, ax,ay anchor fraction of the image (default .5,1), rot, a, flip, glow} */
  MS.sprite = function (c, key, o) {
    const img = MS.img(key); let w = o.w, h = o.h; if (!w) w = h * img.width / img.height; if (!h) h = w * img.height / img.width;
    const ax = o.ax == null ? .5 : o.ax, ay = o.ay == null ? 1 : o.ay;
    c.save(); c.translate(o.x, o.y); if (o.rot) c.rotate(o.rot); if (o.flip) c.scale(-1, 1); c.globalAlpha = o.a == null ? 1 : o.a;
    c.drawImage(img, -ax * w, -ay * h, w, h); if (o.softA) { c.globalAlpha *= o.softA; c.drawImage(MS.soft(key, o.div || 10), -ax * w, -ay * h, w, h); }
    c.restore(); return { x: o.x - ax * w, y: o.y - ay * h, w, h, px: fx => o.x + (fx - ax) * w, py: fy => o.y + (fy - ay) * h };
  };
  /* brightest pixel cluster of a key matching test(r,g,b)->score; normalised {x,y}; fallback fb */
  MS.spot = function (key, name, test, fb) {
    const id = key + '|' + name + '|' + (DEC[key] ? 1 : 0); if (SPOT[id]) return SPOT[id];
    const img = MS.img(key), w = 64, h = Math.max(8, Math.round(64 * img.height / img.width)), c = mkc(w, h), g = c.getContext('2d');
    g.drawImage(img, 0, 0, w, h); const d = g.getImageData(0, 0, w, h).data; let best = -1, bx = fb.x, by = fb.y;
    for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
      let sc = 0; for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) { const k = ((y + j) * w + x + i) * 4; sc += test(d[k], d[k + 1], d[k + 2], d[k + 3]); }
      if (sc > best) { best = sc; bx = (x + .5) / w; by = (y + .5) / h; }
    }
    return SPOT[id] = best > 30 ? { x: bx, y: by } : fb;
  };
  MS.glow = function (c, x, y, r, rgb, a, mode) {
    const g = c.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(' + rgb + ',' + a + ')'); g.addColorStop(.4, 'rgba(' + rgb + ',' + a * .35 + ')'); g.addColorStop(1, 'rgba(' + rgb + ',0)');
    c.save(); c.globalCompositeOperation = mode || 'lighter'; c.fillStyle = g; c.fillRect(x - r, y - r, r * 2, r * 2); c.restore();
  };

  /* ---------------- fog / mist ---------------- */

<script>/* scenes.js */
/* scenes.js — the 10 pages of «Тоқтамайтын жаңбыр» (see ../SCENARIO.md).
   Scene = {id,len(VH),keys[],tr (gradient transition to the next page),draw(c,p,t,s,X),windows[],items[],grade}.
   p = local progress (can overshoot 0..1 slightly inside transitions). Everything is a pure function of (p,t,s): deterministic.
   EYE RULE: an eye window exists exactly three times: page 2 (Merey), page 6 (Sanzhar), page 9 (the pair). All other
   «reel» inserts snap open with a white flash, ride the scroll ~1.6-1.7x faster than the page, and show NON-eye crops. */
(function () {
  const MS = window.MS; MS.scenes = [];
  const { lerp, eo, sm, clamp, TAU } = MS.m;
  const W = () => MS.V.W, H = () => MS.V.H, U = () => MS.V.u;
  const P = Math.PI;

  /* parallax layer: par = how fast it travels over the page (0 far .. 1 near); zoom leaves room so no edge shows */
  const L = (c, key, p, par, o) => MS.layer(c, key, Object.assign({ z: 1 + par * .3, dy: (.5 - clamp(p, -.2, 1.2)) * par * .3 * H() }, o));
  /* window riding the scroll (eye windows). */
  const ride = o => (p, X, len) => ({ cx: o.x0 + (p - o.p0) * len * (o.dx || 0), cy: o.y0 - (p - o.p0) * len * o.rise, w: o.w, ar: o.ar, rot: o.rot || 0 });
  /* repeated reel bursts */
  const reel = o => {
    const st = p => { const q = clamp((p - o.p0) / (o.p1 - o.p0)), n = Math.min(o.n - 1, Math.floor(q * o.n)); return { n, fr: q * o.n - n }; };

      content(c, R, p, t) { const sg = MS.spot('crossing_bg', 'cy', (r, g, b) => (g > 150 && g > r + 50 && b > 110) ? g : 0, { x: .72, y: .27 }); crop(c, 'crossing_bg', sg.x, sg.y, .22, R, '#10161f'); MS.glow(c, 0, 0, R.w * .5, '95,211,192', .5 + .2 * Math.sin(t * 6), 'lighter'); }
    }, reel({ n: 1, p0: .08, p1: .3, duty: .7, xs: [.3], ys: [.8], w: .4, ar: 1.3, rise: 1.65, rots: [-2] })),
    Object.assign({
      id: 'flare',
      content(c, R, p, t) {
        const hl = MS.spot('crossing_car', 'hl', (r, g, b) => (r > 235 && g > 225 && b > 190) ? 255 : 0, { x: .9, y: .6 }); crop(c, 'crossing_car', hl.x, hl.y, .3, R, '#0a0f14');
        MS.glow(c, 0, 0, R.w * .8, '255,244,214', .9, 'lighter'); c.save(); c.globalCompositeOperation = 'lighter'; c.fillStyle = 'rgba(255,255,255,.8)'; c.fillRect(-R.w / 2, -1.5 * U(), R.w, 3 * U()); c.fillRect(-1.5 * U(), -R.h / 2, 3 * U(), R.h); c.restore();
      }
    }, reel({ n: 1, p0: .3, p1: .52, duty: .6, xs: [.72], ys: [.76], w: .4, ar: 1.3, rise: 1.65, rots: [2] }))],
    items: [
      { type: 'cap', text: 'Жасыл жанды. Мен жолға шықтым.', a: .04, b: .98, x: .5, y: .085, w: .8, par: 0 },
      { type: 'sfx', text: 'БИИИП!', a: .34, b: .58, x: .5, y: .3, w: .8, par: 0, cls: 'big' },
      { type: 'cap', text: 'Жүргізуші мені көрмеді.', a: .44, b: .98, x: .5, y: .9, w: .7, par: 0 },
      { type: 'shock', text: 'Мерей!', a: .56, b: .98, x: .3, y: .52, w: .46, h: .26, par: .1 },
      { type: 'cap', text: 'Біреу білегімнен тартып қалды.', a: .68, b: .98, x: .5, y: .085, w: .8, par: 0 }
    ]
  });

  /* ---------- 7 · Иық артынан — «Жақсы белгі емес» ---------- */
  MS.scenes.push({
    id: 'ots', len: 3.8, tr: 'drip', keys: ['ots_bg', 'sanzhar_fig', 'ots_merey_fg'], grade: { bloom: .55 },
    draw(c, p, t, s) {
      const w = W(), h = H(), u = U();
      const map = L(c, 'ots_bg', p, .3, { z: 1.12 });
      const lamp = { x: map.x(.6), y: map.y(.08) }, fx = map.x(.58), fyb = map.y(.8), figH = map.dh * .5;
      c.save(); c.globalCompositeOperation = 'screen'; const cg = c.createLinearGradient(0, lamp.y, 0, fyb + 40 * u); cg.addColorStop(0, 'rgba(242,194,48,.2)'); cg.addColorStop(1, 'rgba(242,194,48,0)');
      c.fillStyle = cg; c.beginPath(); c.moveTo(lamp.x - 8 * u, lamp.y); c.lineTo(lamp.x + 8 * u, lamp.y); c.lineTo(lamp.x + w * .55, fyb + 40 * u); c.lineTo(lamp.x - w * .55, fyb + 40 * u); c.closePath(); c.fill(); c.restore();
      MS.glow(c, lamp.x, lamp.y, w * .3, '255,236,170', .8, 'lighter');
      MS.rain(c, t, s, { id: 'o7', layers: [0, 1], ang: 9, scroll: .3, cone: { x: lamp.x / w, y: lamp.y / h, spread: .42, len: .95 }, gap: { x: fx / w, y: (fyb - figH * .5) / h, rx: .15, ry: figH * .62 / h } });
      MS.glow(c, fx, fyb - figH * .5, figH * .55, '255,226,150', .08, 'screen');
      MS.sprite(c, 'sanzhar_fig', { x: fx + lerp(8, -8, p) * u, y: fyb, h: figH, ax: .5, ay: 1 });
      MS.rain(c, t, s, { id: 'o7', layers: [2], ang: 9, scroll: .3, cone: { x: lamp.x / w, y: lamp.y / h, spread: .42, len: .95 }, gap: { x: fx / w, y: (fyb - figH * .5) / h, rx: .15, ry: figH * .62 / h }, splash: { y: .84, band: .05, n: 30 } });
      L(c, 'ots_merey_fg', p, 1.5, { z: 1.2 + .06 * p, dy: -(p - .5) * .2 * h, dx: lerp(10, -14, p) * u, softA: .6, div: 12 });
    },
    items: [
      { type: 'cap', text: 'Оның үстіне бірде-бір тамшы түспейді.', a: .06, b: .98, x: .5, y: .085, w: .8, par: 0 },
      { type: 'bub', text: 'Сен… мені көріп тұрсың ба?', lines: ['Сен… мені', 'көріп тұрсың ба?'], a: .28, b: .98, x: .3, y: .24, par: .1, tail: 'bl' },
      { type: 'bub', text: 'Көріп тұрмын.', a: .5, b: .98, x: .7, y: .27, w: .36, h: .17, par: .1, tail: 'br' },
      { type: 'bub', text: 'Және бұл — жақсы белгі емес.', lines: ['Және бұл —', 'жақсы белгі емес.'], a: .7, b: .98, x: .68, y: .43, par: .1, tail: 'br' }
    ]
  });

  /* ---------- 8 · Шатыр — «Жаңбыр кері жауады» ---------- */
  const upK = p => sm((p - .36) / .32);
  MS.scenes.push({
    id: 'roof', len: 4.4, tr: 'rise', keys: ['roof_sky', 'roof_deck', 'roof_pair'], grade: { bloom: .55 },
    draw(c, p, t, s) {
      const w = W(), h = H(), u = U(), up = upK(p);
      L(c, 'roof_sky', p, .2, { z: 1.16 });
      MS.rain(c, t, s, { id: 'r8', layers: [0], k: .9, up, ang: 8, scroll: .15 });
      const map = L(c, 'roof_deck', p, 1.0, { z: lerp(1.1, 1.45, eo(p)), fy: .6, dy: (.5 - p) * .06 * h });
      const neon = MS.spot('roof_deck', 'neon', (r, g, b) => (Math.max(r, g, b) > 200 && Math.abs(r - g) + Math.abs(g - b) > 60) ? 255 : 0, { x: .72, y: .34 });
      MS.glow(c, map.x(neon.x), map.y(neon.y), h * .24, '95,211,192', .22 + .05 * Math.sin(t * 2.3), 'screen');
      MS.ripples(c, t, s, { id: 'r8', n: 9, asp: .3, rmax: 40, y0: map.y(.72) / h, y1: map.y(.95) / h, alpha: 1 - up });
      MS.sprite(c, 'roof_pair', { x: map.x(.5), y: map.y(.62), h: map.dh * .2, ax: .5, ay: 1 });
      MS.rain(c, t, s, { id: 'r8', layers: [1, 2], up, ang: 8, scroll: .5 });
      if (up > .05) MS.glow(c, w * .5, h * .45, w * .8, '197,208,218', .1 * Math.sin(Math.PI * clamp(up)), 'screen');
    },
    items: [
      { type: 'cap', text: 'Ол мені шатырға алып шықты.', a: .04, b: .98, x: .5, y: .085, w: .8, par: 0 },
      { type: 'bub', text: 'Қара.', a: .24, b: .98, x: .7, y: .22, w: .26, h: .15, par: .1, tail: 'bl' },
      { type: 'cap', text: 'Тамшылар… аспанға қайтып барады.', a: .42, b: .98, x: .5, y: .9, w: .8, par: 0 },
      { type: 'bub', text: 'Біреу сені шын есіне алғанда, жаңбыр кері жауады.', lines: ['Біреу сені шын', 'есіне алғанда,', 'жаңбыр кері жауады.'], a: .58, b: .98, x: .3, y: .3, par: .1, tail: 'br' },
      { type: 'thought', text: 'Демек, мені әлі біреу ұмытпаған.', lines: ['Демек, мені әлі', 'біреу ұмытпаған.'], a: .8, b: .98, x: .68, y: .66, par: .1 }
    ]
  });

  /* ---------- 9 · Екі көз — «Тек ұмытылғандар» ---------- */
  const pairG = p => 3 * sm((p - .28) / .45);
  MS.scenes.push({
    id: 'eyes', len: 3.6, tr: 'flash', keys: ['pair_0', 'pair_1', 'pair_2', 'pair_3'], grade: { bloom: .55 },
    draw(c, p, t, s) {
      const w = W(), h = H(), u = U(), r = MS.rng(909);
      const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#0f151d'); g.addColorStop(.6, '#1b2430'); g.addColorStop(1, '#10161e'); c.fillStyle = g; c.fillRect(0, 0, w, h);
      const cols = ['242,194,48', '197,208,218', '110,137,163', '95,211,192', '201,150,42'];
      for (let i = 0; i < 22; i++) { const x = (r() + .02 * Math.sin(t * .3 + i)) * w, y = ((r() * .9 + .05) - p * .06 * (1 + r())) * h, rad = (22 + r() * 60) * u; MS.glow(c, x, y, rad, cols[Math.floor(r() * 5)], .13 + .06 * Math.sin(t * .8 + i), 'screen'); }
      MS.rain(c, t, s, { id: 'e9', layers: [0, 1, 2], k: .8, ang: 11, scroll: .3, alpha: .8 });
      MS.glow(c, w / 2, h * .47, w * .8, '110,137,163', .12 + .1 * sm((p - .5) / .3), 'screen');
    },
    windows: [{      // EYE 3/3 — both eyes, once in the whole episode
      id: 'pair', on: p => p > .05, push: .05, ar: 1600 / 560,
      content(c, R, p, t) {
        const g = pairG(p), a = Math.min(3, Math.floor(g)), b = Math.min(3, a + 1), f = a >= 3 ? 0 : sm(g - a), push = 1.03 + .05 * clamp(p);
        MS.coverInto(c, MS.img('pair_' + a), -R.w / 2, -R.h / 2, R.w, R.h, push, 0, 0);
        if (f > .01) { c.globalAlpha = f; MS.coverInto(c, MS.img('pair_' + b), -R.w / 2, -R.h / 2, R.w, R.h, push, 0, 0); c.globalAlpha = 1; }
      },
      rect: p => ({ cx: .5, cy: .47, w: lerp(.82, 1.0, eo((p - .05) / .3)), ar: 1600 / 560, rot: 0 })
    }],
    items: [
      { type: 'bub', cls: 'voice', text: 'Бізді тек ұмытылғандар ғана көре алады.', lines: ['Бізді тек ұмытылғандар', 'ғана көре алады.'], a: .1, b: .98, x: .5, y: .13, par: .08, tail: 'none' },
      { type: 'bub', cls: 'voice', text: 'Бұл қала мені үш жыл бұрын ұмытқан.', lines: ['Бұл қала мені үш жыл', 'бұрын ұмытқан.'], a: .34, b: .98, x: .5, y: .28, par: .08, tail: 'none' },
      { type: 'thought', text: 'Ол мені көріп тұр. Демек…', lines: ['Ол мені көріп тұр.', 'Демек…'], a: .62, b: .98, x: .5, y: .78, par: .08 }
    ]
  });

  /* ---------- 10 · Финал — «Жеті күн» ---------- */
  MS.scenes.push({
    id: 'finale', len: 4.2, keys: ['finale_sky', 'finale_city', 'finale_roof'], grade: { bloom: .55 },
    draw(c, p, t, s) {
      const w = W(), h = H(), u = U();
      L(c, 'finale_sky', p, .15, { z: 1.14 });
      MS.lightning(c, t, { x: .7, per: 5.2, off: 1.4, sky: .45 });
      MS.rain(c, t, s, { id: 'f10', layers: [0], ang: 12, scroll: .15 });
      L(c, 'finale_city', p, .5, { z: 1.22 });
      MS.mist(c, t, s, { y: .62, h: .3, par: .4, vx: 7, alpha: .35 });
      L(c, 'finale_roof', p, 1.0, { z: lerp(1.25, 1.38, eo(p)) });
      MS.rain(c, t, s, { id: 'f10', layers: [1, 2], ang: 13, scroll: .5, splash: { y: .93, band: .04, n: 24 } });
      const Lg = sm((p - .7) / .25); if (Lg > 0) MS.glow(c, w / 2, h * .42, lerp(.2, .9, Lg) * h, cold, .22 * Lg, 'lighter');
    },
    items: [
      { type: 'cap', text: 'Жаңбыр тоқтаған күні мен толық жоғаламын.', a: .06, b: .98, x: .5, y: .085, w: .8, par: 0 },
      { type: 'bub', text: 'Жеті күнің бар.', a: .28, b: .98, x: .68, y: .26, w: .4, h: .17, par: .1, tail: 'bl' },
      { type: 'cap', cls: 'big s', text: 'Жеті күнде бүкіл қала мені қайта есіне алуы керек.', a: .5, b: .98, x: .5, y: .56, w: .92, par: 0, stg: .04 },
      { type: 'end', text: 'Жалғасы бар…', a: .78, b: 9, x: .5, y: .9, w: .7, par: 0, edge: .03 }
    ]
  });
})();
