:root{--red:#CF2A1B;--ink:#15110F;--paper:#EEE6D6;--blue:#2456D3;--gold:#E5A823}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--ink);overflow-x:hidden;overscroll-behavior:none}
body{font-family:'IBM Plex Mono',monospace;color:var(--ink)}
body.capture{overflow:hidden}
body.fine{cursor:none}
#gl{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block;z-index:1}
#frame{position:fixed;left:0;top:0;width:1000px;height:1400px;transform-origin:0 0;z-index:2;pointer-events:none}
#hud{position:fixed;inset:0;z-index:5;pointer-events:none}
#spacer{width:1px;pointer-events:none}
body.art #hud .mark,body.art #hud .prog{display:none}

/* caption slips (hanji) */
.cap{position:absolute;left:0;top:0;display:none;overflow:hidden;background-color:var(--paper);
 background-image:repeating-linear-gradient(90deg,rgba(110,85,50,.07) 0 1px,transparent 1px 6px),repeating-linear-gradient(0deg,rgba(110,85,50,.05) 0 1px,transparent 1px 11px);
 border:1px solid var(--ink);box-shadow:5px 6px 0 rgba(21,17,15,.55);transform-origin:0 0;will-change:transform}
.capin{position:relative;padding:16px 20px 16px 44px;font:500 26px/1.38 'IBM Plex Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.capseal{position:absolute;left:10px;top:10px;width:20px;height:20px;background:var(--red);transform:rotate(-4deg);box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 5px var(--red)}
.cap .w{display:inline-block;white-space:nowrap}
.cap .c{visibility:hidden}

/* SFX */
.sfx{position:absolute;left:0;top:0;white-space:nowrap;text-align:center;display:none;will-change:transform}
.sfxm{line-height:1;-webkit-text-stroke:6px var(--ink);text-shadow:6px 6px 0 var(--red)}
.sfxm span{display:inline-block;position:relative}
.sfxm span::after{content:attr(data-c);position:absolute;left:0;top:0;-webkit-text-stroke:0;text-shadow:none;color:inherit}
.sfxm.impact{font-family:'Black Han Sans','Song Myung',sans-serif}
.sfxm.brush{-webkit-text-stroke:4px var(--ink);text-shadow:4px 4px 0 var(--red);font-family:'East Sea Dokdo','Song Myung',cursive;letter-spacing:.02em}
.c-paper{color:var(--paper)}.c-red{color:var(--red);text-shadow:6px 6px 0 var(--ink)}.c-ink{color:var(--ink);text-shadow:6px 6px 0 var(--red)}
.sfxm.echo{-webkit-text-stroke:3px var(--ink);text-shadow:none}
.sfxm.echo span::after{display:none}
.gloss{display:inline-block;margin-top:8px;padding:3px 12px;background:var(--ink);color:var(--paper);font:500 22px/1.2 'IBM Plex Mono',monospace;letter-spacing:.06em}

/* HUD */
.mark{position:absolute;right:12px;top:12px;display:flex;flex-direction:row-reverse;gap:3px;padding:9px 6px;background:var(--red);color:var(--paper);font:400 17px/1 'Song Myung',serif;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);transform:rotate(1.5deg)}
.mark span{writing-mode:vertical-rl;text-orientation:upright;letter-spacing:.08em}
.mark.blink{background:var(--paper);color:var(--red)}
.prog{position:absolute;right:20px;top:128px;bottom:70px;width:0}
.prog .line{position:absolute;left:-1px;top:0;bottom:0;width:2px;background:var(--paper);box-shadow:0 0 0 1px var(--ink)}
.prog .tick{position:absolute;left:-8px;width:16px;height:2px;margin-top:-1px;background:var(--paper);box-shadow:0 0 0 1px var(--ink)}
.prog .tick.on{left:-6px;width:12px;height:12px;margin-top:-6px;background:var(--red);box-shadow:0 0 0 2px var(--ink)}
.cdot{position:absolute;left:0;top:0;width:8px;height:8px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 1.5px var(--paper);display:none}
.cring{position:absolute;left:0;top:0;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--ink);box-shadow:0 0 0 1px var(--paper);display:none}
.seal{position:absolute;left:0;top:0;width:92px;height:92px;display:none;overflow:hidden;background:var(--red);border:3px solid var(--ink);box-shadow:3px 4px 0 rgba(21,17,15,.6);transform:rotate(-4deg);text-align:center;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.seal.on{display:block}
.seal .fill{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--ink)}
.seal span{position:relative;display:flex;align-items:center;justify-content:center;width:100%;height:100%;padding:4px;color:var(--paper);font:500 14px/1.25 'Song Myung','IBM Plex Mono',monospace;letter-spacing:.04em;white-space:pre-line;text-transform:uppercase}
.seal.btn{position:fixed;left:50%;top:auto;bottom:calc(26px + env(safe-area-inset-bottom,0px));margin-left:-46px;pointer-events:auto;touch-action:none}
.seal.btn.held{transform:rotate(-4deg) scale(.95)}

/* loader */
#loader{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;transition:opacity .5s .1s,visibility 0s .6s}
#loader.done{opacity:0;visibility:hidden}
body.capture #loader{display:none}
.lseal{width:64px;height:64px;background:var(--red);color:var(--paper);display:flex;align-items:center;justify-content:center;font:400 24px 'Song Myung',serif;transform:rotate(-4deg);border:2px solid var(--paper)}
.lbar{width:170px;height:8px;border:1px solid var(--paper)}
.lbar i{display:block;height:100%;width:0;background:repeating-linear-gradient(60deg,var(--paper) 0 2px,transparent 2px 5px);transition:width .3s}
@media (prefers-reduced-motion:reduce){#loader{transition:none}}

</style>

<script>/* engine/input.js */
/* input.js — pointer / touch / keyboard hold; pointer position in world units */
(function () {
  'use strict';
  var MK = window.MK;
  var I = MK.input = { holding: false, pointer: { x: 500, y: 700 }, pointerActive: false, dragging: false, dragDelta: { x: 0, y: 0 }, holdActive: false };
  var CAP = /[?&]capture(=1)?(&|$)/.test(location.search);
  var down = false, last = null, space = false, btnHold = false, mouseHold = false;
  function upd() { I.holding = space || btnHold || mouseHold; }
  function setP(e) {
    var w = MK.view.toWorld(e.clientX, e.clientY); I.pointer.x = w[0]; I.pointer.y = w[1];
  }
  window.addEventListener('pointermove', function (e) {
    if (CAP || e.pointerType === 'touch') return;
    setP(e); I.pointerActive = true;
    if (down && last) { I.dragDelta.x += w2(e.clientX - last[0]); I.dragDelta.y += w2(e.clientY - last[1]); }
    if (down) last = [e.clientX, e.clientY];
  }, { passive: true });
  function w2(px) { return px / MK.view.s; }
  window.addEventListener('pointerdown', function (e) {
    if (CAP) return;
    var onBtn = e.target && e.target.closest && e.target.closest('.seal.btn');
    if (onBtn) { btnHold = true; upd(); e.preventDefault(); return; }
    if (e.pointerType === 'touch') return;
    setP(e); I.pointerActive = true; down = true; last = [e.clientX, e.clientY]; I.dragging = true;
    if (I.holdActive) { mouseHold = true; upd(); }
  });
  window.addEventListener('pointerup', function () { btnHold = false; down = false; I.dragging = false; last = null; mouseHold = false; upd(); });
  window.addEventListener('pointercancel', function () { btnHold = false; down = false; I.dragging = false; mouseHold = false; upd(); });
  window.addEventListener('blur', function () { down = false; mouseHold = false; space = false; btnHold = false; upd(); });
  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space' && I.holdActive) { space = true; upd(); e.preventDefault(); }
  });
  window.addEventListener('keyup', function (e) { if (e.code === 'Space') { space = false; upd(); } });
  window.addEventListener('contextmenu', function (e) { if (e.target && e.target.closest && e.target.closest('.seal')) e.preventDefault(); });
  /* capture mode override */
  I.set = function (o) {
    if (!o) o = {};
    I.holding = !!o.holding;
    if (o.pointer) { I.pointer.x = o.pointer.x; I.pointer.y = o.pointer.y; I.pointerActive = true; }
  };
  I.endFrame = function () { I.dragDelta.x = 0; I.dragDelta.y = 0; };
})();

<script>/* art/bell.js */
/* art/bell.js — Korean bronze temple bell (범종). MK.art.bell(P, cx, topY, s)
   (cx, topY) = centre of the shoulder (top of the barrel). s = scale (number) or {scale, glint:0..1 (gold glint)}.
   Local geometry (scale 1): barrel 0..760 tall, shoulder 340 wide, lip 428 wide; dragon loop above (-62..0), sound tube at x 60..100. */
(function () {
  'use strict';
  var MK = window.MK, art = MK.art = MK.art || {};
  var HALF = null;

  function profile() {
    if (HALF) return HALF;
    var r = [[0, 0], [110, 2], [150, 22], [171, 70], [177, 200], [185, 420], [199, 620], [209, 700], [214, 754]];
    var half = MK.P.smooth(r, 8, false), left = half.slice(1, -1).map(function (p) { return [-p[0], p[1]]; }).reverse();
    HALF = { poly: half.concat([[-214, 754]]).concat(left), half: half };
    return HALF;
  }
  function bandDots(P, y0, y1, hw) {
    var y = (y0 + y1) / 2, x;
    for (x = -hw + 12; x < hw; x += 24) P.circle(x, y, 5, { c: 'paper', t: 0 });
    P.stroke([[-hw, y0 + 5], [hw, y0 + 5]], { w: 2.4, c: 'paper' }); P.stroke([[-hw, y1 - 5], [hw, y1 - 5]], { w: 2.4, c: 'paper' });

  art.bell = function (P, cx, topY, s) {

    /* sound tube (음통) behind the dragon */
    P.poly([[58, 8], [64, -74], [98, -74], [104, 8]], { c: 'paper', t: P.lin(58, 0, 104, 0, [[0, .7], [.4, .15], [1, .8]]), a: 0, stroke: { w: 3.6, c: 'ink' } });
    P.ellipse(81, -74, 17, 6, { c: 'ink', t: 0 });
    [[-60, -52], [-24, -16]].forEach(function (b) { P.poly([[60.5, b[1]], [101.5, b[1]], [101.5, b[0]], [62.5, b[0]]], { c: 'ink', t: 0 }); P.stroke([[62, (b[0] + b[1]) / 2], [100, (b[0] + b[1]) / 2]], { w: 2, c: 'paper' }); });

    P.poly(g.poly, { c: 'paper', t: P.lin(-214, 0, 214, 0, [[0, .85], [.25, .35], [.45, .15], [.7, .4], [1, .9]]), a: 0, stroke: { w: 5, c: 'ink' } });

      P.rect(-230, 30, 460, 60, { c: 'ink', t: 0 }); bandDots(P, 30, 90, 230);
      P.rect(-230, 690, 460, 50, { c: 'ink', t: 0 }); bandDots(P, 690, 740, 230);

      P.stroke([[-6, 92], [-6, 688]], { w: 2, c: 'ink', t: .0 });

      [[-130, 110], [30, 110]].forEach(function (pp) {
        P.rect(pp[0] - 6, pp[1] - 6, 112, 122, { c: 'ink', t: 0 });
        P.rect(pp[0], pp[1], 100, 110, { c: 'paper', t: .18, a: 0, stroke: { w: 3, c: 'ink' } });
        for (i = 0; i < 3; i++) for (j = 0; j < 3; j++) {

          P.circle(kx, ky, 9.5, { c: 'paper', t: 0, stroke: { w: 3, c: 'ink' } }); P.circle(kx - 2, ky - 2, 3, { c: 'ink', t: 0 });
        }
      });
      /* 당좌 lotus medallion at (0,520) r 62 */
      P.circle(0, 520, 66, { c: 'ink', t: 0 });
      P.circle(0, 520, 62, { c: 'paper', t: .12, a: 0, stroke: { w: 3, c: 'ink' } });
      for (k = 0; k < 8; k++) {
        var an = k * Math.PI / 4;

      for (k = 0; k < 6; k++) P.circle(Math.cos(k * 1.047) * 9, 520 + Math.sin(k * 1.047) * 9, 2.4, { c: 'ink', t: 0 });

    P.taper([[-72, 6], [-60, -26], [-22, -34], [8, -62], [46, -54], [62, -22], [56, 6]], function (u) { return 34 - 14 * Math.sin(u * Math.PI); }, { c: 'ink', t: 0 }, 6);

    if (s.glint > .01) {

<script>/* art/carver.js */
/* art/carver.js — the woodblock carver (각수): young woman, BACK VIEW, hanbok. MK.art.carver(P,x,y,size,s) */
(function () {
  'use strict';
  var MK = window.MK, art = MK.art = MK.art || {};
  var TAU = Math.PI * 2;

  /* s = {pose:'stand'|'seat', t:seconds (ribbon phase), arm:0..1 (seat: carving cycle), shadow:bool}

        { c: 'paper', t: tone, a: 0, stroke: OUT }, 8);

      poly([[-.052, -.915], [-.02, -.88], [0, -.865], [.02, -.88], [.052, -.915]], INK);

<script>/* art/door.js */

(function () {
  'use strict';
  var MK = window.MK, clamp = MK.clamp, E = MK.ease, TAU = Math.PI * 2;
  var BLK = { x: 90, y: 170, w: 820, h: 1060 };
  var IN = { x0: 138, y0: 218, x1: 862, y1: 1182 };          // cleared ground = inside the raised border band
  var TG = { x: 500, y: 700, s: 700 };
  var ROWS = 8, SEC_PER_P = 2.5;

  /* arcs of chisel facets in the cleared ground (stateless, seeded) */
  var ARCS = (function () {
    var r = MK.rng(77), out = [], i;
    for (i = 0; i < 360; i++) out.push({ x: IN.x0 + 8 + r() * (IN.x1 - IN.x0 - 16), y: IN.y0 + 6 + r() * (IN.y1 - IN.y0 - 12), a: (r() - .5) * 1.6, l: 14 + r() * 20, k: r() < .5 ? -1 : 1 });
    return out;
  })();
  function rowOf(y) { return Math.min(ROWS - 1, Math.floor((y - IN.y0) / ((IN.y1 - IN.y0) / ROWS))); }

  /* head outline of the block-mode tiger in world coords, captured from the tiger API with a recording proxy */
  var HEAD = null;
  function headPts(P) {
    if (HEAD) return HEAD;
    var cap = null, Q = Object.create(P);
    ['push', 'pop', 'translate', 'rotate', 'scale', 'rect', 'circle', 'ellipse', 'path', 'stroke', 'line', 'taper', 'text', 'transform'].forEach(function (n) { Q[n] = function () { }; });
    Q.poly = function (pts) { if (!cap) cap = pts; };
    Q.clip = function (sh, inner) { inner(); }; Q.toneOnly = function (fn) { fn(); }; Q.fillOnly = function (fn) { fn(); };
    MK.art.tiger(Q, TG.x, TG.y, TG.s, { mode: 'block', mirror: true, carve: 1, inked: 0 });
    HEAD = (cap || []).map(function (p) { return [TG.x - p[0] * TG.s / 2, TG.y + p[1] * TG.s / 2]; });
    return HEAD;
  }
  /* tip of the carve at carve value c (dry run: nothing is painted) */
  function tipAt(P, c) {
    var f = P._f, t = P._t, s = { mode: 'block', mirror: true, carve: c, inked: 0 };
    P._f = P._t = false;
    try { MK.art.tiger(P, TG.x, TG.y, TG.s, s); } finally { P._f = f; P._t = t; }
    return s.tip;
  }

  function desk(P) { P.cover({ c: 'paper', t: .82, h: 'grain', a: 90 }); }

  function board(P) {
    var b = BLK;
    P.rect(b.x + 14, b.y + 20, b.w, b.h, { c: 'ink', t: 0 });                                       // drop shadow on the desk
    P.rect(b.x, b.y, b.w, b.h, { c: 'paper', t: .32, h: 'grain', a: 0, stroke: { w: 4, c: 'ink' } });
    /* raised border band */
    var ring = new Path2D(); ring.rect(IN.x0 - 16, IN.y0 - 16, IN.x1 - IN.x0 + 32, IN.y1 - IN.y0 + 32); ring.rect(IN.x0, IN.y0, IN.x1 - IN.x0, IN.y1 - IN.y0);
    P.path(ring, { c: 'paper', t: .32, h: 'grain', a: 0, rule: 'evenodd', stroke: { w: 3.4, c: 'ink' } });
  }
  function caps(P) {
    [[120, 0], [1210, 1]].forEach(function (c) {
      P.rect(70, c[0], 860, 70, { c: 'paper', t: .8, h: 'grain', a: 90, stroke: { w: 4, c: 'ink' } });
      P.stroke([[74, c[0] + (c[1] ? 14 : 56)], [926, c[0] + (c[1] ? 14 : 56)]], { w: 2.4, c: 'paper' });
      [96, 904].forEach(function (x) { P.circle(x, c[0] + 35, 11, { c: 'paper', t: 0, stroke: { w: 3, c: 'ink' } }); P.circle(x, c[0] + 35, 3.4, { c: 'ink', t: 0 }); });
    });
  }
  /* cleared ground: boustrophedon rows; c = 0..1 -> {x,y} chisel position */
  function clearGround(P, c) {
    if (c <= 0) return null;
    var rowH = (IN.y1 - IN.y0) / ROWS, W = IN.x1 - IN.x0, pass = Math.min(ROWS - 1, Math.floor(c * ROWS)), f = c * ROWS - pass, dir = pass % 2 ? -1 : 1;
    if (c >= 1) { pass = ROWS - 1; f = 1; dir = (ROWS - 1) % 2 ? -1 : 1; }
    var xcur = dir > 0 ? IN.x0 + W * f : IN.x1 - W * f, y0 = IN.y0 + pass * rowH;
    var st = { c: 'paper', t: .66, h: 'grain', a: 90 };
    if (pass > 0) P.rect(IN.x0, IN.y0, W, rowH * pass, st);
    if (dir > 0) P.rect(IN.x0, y0, W * f, rowH, st); else P.rect(xcur, y0, W * f, rowH, st);
    ARCS.forEach(function (a) {
      var r = rowOf(a.y); if (r > pass) return;
      if (r === pass && (dir > 0 ? a.x > xcur : a.x < xcur)) return;
      var co = Math.cos(a.a), si = Math.sin(a.a), h = a.l / 2;
      P.stroke([[a.x - co * h, a.y - si * h + 3 * a.k], [a.x, a.y - 3 * a.k], [a.x + co * h, a.y + si * h + 3 * a.k]], { w: 2.4, c: 'paper' });
    });
    return { x: xcur, y: y0 + rowH * .5 };
  }

  /* o = {carve (master 0..1), inked: 0|1, mask: Path2D|null} -> {tip, clear} */
  function drawBlock(P, o) {
    board(P);
    var clearC = MK.range(o.carve, .6, 1), tc = Math.min(1, o.carve / .6), clr = clearGround(P, clearC);
    var tip = null;
    if (o.inked && !o.mask) tip = MK.art.tiger(P, TG.x, TG.y, TG.s, { mode: 'block', mirror: true, carve: 1, inked: 1 });
    else {
      tip = MK.art.tiger(P, TG.x, TG.y, TG.s, { mode: 'block', mirror: true, carve: tc, inked: 0 });
      if (o.mask) P.clip(o.mask, function () { MK.art.tiger(P, TG.x, TG.y, TG.s, { mode: 'block', mirror: true, carve: 1, inked: 1 }); });
    }
    caps(P);
    return { tip: tip, clear: clr };
  }
  MK.blockArt = { BLK: BLK, TG: TG, desk: desk, drawBlock: drawBlock, headPts: headPts, tipAt: tipAt };

  /* ---- inking brush ---- */
  var BR = { w: 585, ang: 1.15 }, SL = Math.cos(BR.ang) / Math.sin(BR.ang);          // face line: x = bx + SL * (y - yc)
  var HALF = [{ y0: 160, y1: 700, yc: 435 }, { y0: 700, y1: 1240, yc: 965 }];
  var STREAK = (function () {
    var r = MK.rng(41), out = [], i;
    for (i = 0; i < 46; i++) out.push({ f: r(), l: 60 + r() * 150, h: 3 + r() * 4, g: 4 + r() * 18 });
    return out;
  })();
  function edgeX(bx, h, y) { return bx + SL * (y - HALF[h].yc) + 16 * MK.noise1(y * .045 + h * 7) + 8 * MK.noise1(y * .16 + 3 + h); }

  function chiselDraw(P, x, y, ang, k) {
    /* soft tone shadow of the shaft, then the chisel */
    P.blur(5, function () { P.toneOnly(function () { P.taper([[x + 14 - Math.cos(ang) * 260, y + 18 - Math.sin(ang) * 260], [x + 14, y + 18]], [26, 8], { c: 'ink', t: .7 }, 2); }); });
    MK.art.chisel(P, x, y, ang, { size: k || .78 });
  }

  MK.scene({
    id: 's04', order: 40, len: 2.2, title: 'Ою және бояу', hold: null,
    overlay: [
      { type: 'caption', at: [.08, .5], x: 90, y: 22, w: 600, side: 'l', rot: -1, text: '81 259-шы тақта. Онда бірде-бір әріп болмауы керек еді.' },
      { type: 'sfx', at: [.05, .45], x: 330, y: 1345, size: 96, rot: -3, font: 'brush', color: 'paper', fx: 'wobble', text: '사각사각', gloss: 'сық-сық' },
      { type: 'sfx', at: [.56, .68], x: 610, y: 1345, size: 110, rot: 3, font: 'brush', color: 'paper', fx: 'wobble', text: '쓱—', gloss: 'сырт' },
      { type: 'sfx', at: [.74, .86], x: 350, y: 1345, size: 120, rot: -4, font: 'brush', color: 'paper', fx: 'pop', text: '쓱!', gloss: 'сырт' }
    ],
    init: function (st) { st.dk = [0, 0]; },
    draw: function (ctx) {
      var P = ctx.P, p = ctx.p, t = ctx.t, inp = ctx.input || {}, st = ctx.state, i;
      var m = MK.range(p, 0, .5);
      desk(P);
      /* ---- inking state ---- */
      var kS = [MK.range(p, .55, .72), MK.range(p, .72, .9)], k = [kS[0], kS[1]];
      if (p < .55) st.dk = [0, 0];
      var act = p < .72 ? 0 : 1;
      if (p >= .55 && p < .9 && inp.dragging && inp.pointer && inp.pointer.x > 60 && inp.pointer.x < 960 && inp.pointer.y > HALF[act].y0 - 40 && inp.pointer.y < HALF[act].y1 + 40)
        st.dk[act] = Math.max(st.dk[act], MK.range(inp.pointer.x, 70, 940));
      if (p >= .55) { k[0] = Math.max(k[0], st.dk[0]); k[1] = Math.max(k[1], st.dk[1]); }
      var BX0 = -90, BX1 = 1120, bx = [MK.lerp(BX0, BX1, E.inOutQuad(k[0])), MK.lerp(BX0, BX1, E.inOutQuad(k[1]))];
      var mask = null;
      if (k[0] > 0 || k[1] > 0) {
        mask = new Path2D();
        [0, 1].forEach(function (h) {
          if (k[h] <= 0) return;
          var H = HALF[h], y;
          mask.moveTo(40, H.y0);
          for (y = H.y0; y <= H.y1; y += 10) mask.lineTo(edgeX(bx[h], h, y), y);
          mask.lineTo(40, H.y1); mask.closePath();
        });
      }
      var inked = p >= .9 && k[0] >= 1 && k[1] >= 1 ? 1 : 0;
      var res = drawBlock(P, { carve: m, inked: inked, mask: inked ? null : mask });

      /* wet sheen right behind the brush edge */
      [0, 1].forEach(function (h) {
        if (k[h] <= 0 || k[h] >= 1) return;
        var H = HALF[h], fade = 1 - MK.range(k[h], .86, 1);
        P.clip(headPts(P), function () {
          STREAK.forEach(function (s) {
            var y = H.y0 + 8 + s.f * (H.y1 - H.y0 - 16), ex = edgeX(bx[h], h, y) - 5, x0 = ex - s.l;
            P.alpha(fade, function () { P.rect(x0, y, s.l, s.h, { c: 'red', t: P.lin(x0, 0, ex, 0, [[0, 0], [1, .24]]), a: 90 }); });
          });
        });
      });

      /* ---- chisel + chips ---- */
      if (p < .52) {
        var CA = -35 * Math.PI / 180, dir = [Math.cos(CA), Math.sin(CA)], pos = null;
        if (m < .6 || !res.clear) { var tp = res.tip || tipAt(P, 5e-4); if (tp) pos = [tp.x, tp.y]; }
        else {
          var le = tipAt(P, 1), bl = E.smoothstep(MK.range(m, .6, .65));
          pos = le ? [MK.lerp(le.x, res.clear.x, bl), MK.lerp(le.y, res.clear.y, bl)] : [res.clear.x, res.clear.y];
        }
        if (pos) {
          var away = 720 * (1 - E.outCubic(MK.range(m, 0, .035))) + 900 * E.inQuad(MK.range(m, .97, 1)), jit = 2 * Math.sin(t * 38);
          chiselDraw(P, pos[0] - dir[0] * away + jit, pos[1] - dir[1] * away, CA + .015 * Math.sin(t * 30), .78);
        }
        /* wood chips: events along the carving path (+ the clearing path) */
        var STEP = .03, e0 = Math.floor(m / STEP), j;
        for (j = 0; j < 13; j++) {
          var ev = (e0 - j) * STEP; if (ev <= 0) break;
          var tau = (m - ev) * .5 * SEC_PER_P, cp = null;
          if (tau > .75) break;
          if (ev < .6) { var tq = tipAt(P, Math.min(1, ev / .6)); if (tq) cp = [tq.x, tq.y]; }
          else {
            var cc = MK.range(ev, .6, 1), rowH = (IN.y1 - IN.y0) / ROWS, W = IN.x1 - IN.x0, pass = Math.min(ROWS - 1, Math.floor(cc * ROWS)), f = cc * ROWS - pass, dr = pass % 2 ? -1 : 1;
            cp = [dr > 0 ? IN.x0 + W * f : IN.x1 - W * f, IN.y0 + pass * rowH + rowH * .5];
          }
          if (cp) MK.fx.chips(P, { seed: (e0 - j) * 7 + 3, n: 2, x: cp[0], y: cp[1], tau: tau + .02, dir: -1.7, spread: 2.2, speed: 330, g: 1200, life: .6, size: 9 });
        }
      }

      /* ---- ink brush ---- */
      var show = -1, bxx = 0;
      if (p >= .55 && p < .72 && k[0] < 1) { show = 0; bxx = bx[0]; }
      else if (p >= .72 && p < .9 && k[1] < 1) { show = 1; bxx = bx[1]; }
      if (show >= 0) {
        var enter = show === 1 ? 700 * (1 - E.outCubic(MK.range(p, .715, .745))) : 0;
        MK.art.inkBrush(P, bxx, HALF[show].yc + enter, BR.w, BR.ang + .02 * Math.sin(t * 9), { wet: .9, tip: 'red', seed: 5 });
      }
    }
  });
})();

</script>
<script>/* scenes/s05_press.js */
/* s05 — 찍기: a hanji sheet drops on the inked block, the pad rubs the red print through (HOLD), the sheet peels off diagonally,
   then the printed sheet returns and grows to fill the screen (= first frame of s06). */
(function () {
  'use strict';
  var MK = window.MK, clamp = MK.clamp, E = MK.ease, TAU = Math.PI * 2, lerp = MK.lerp;
  var RECT = { x: 60, y: 140, w: 880, h: 1120 }, CX = 500, CY = 700;
  var PHI = 22 * Math.PI / 180, NX = Math.cos(PHI), NY = Math.sin(PHI);          // fold normal (points to the bottom-right corner side)
  var C0 = NX * (RECT.x + RECT.w) + NY * (RECT.y + RECT.h), C1 = NX * RECT.x + NY * RECT.y - 70;
  var RECT_PTS = [[RECT.x, RECT.y], [RECT.x + RECT.w, RECT.y], [RECT.x + RECT.w, RECT.y + RECT.h], [RECT.x, RECT.y + RECT.h]];
  var RUB_R = 120, PAD_R = 104;

  function rubPoint(u) { return [500 + 330 * Math.sin(u * TAU * 6), 230 + u * 900]; }
  function halfPoly(c, side, extra) {
    var L = 5000, tx = -NY, ty = NX, ax = c * NX + tx * L, ay = c * NY + ty * L, bx = c * NX - tx * L, by = c * NY - ty * L, d = side * (extra == null ? L : extra);
    return [[ax, ay], [bx, by], [bx + NX * d, by + NY * d], [ax + NX * d, ay + NY * d]];
  }
  function printTiger(P, mirror, size, cy) { MK.art.tiger(P, 500, cy == null ? 700 : cy, size || 700, { mode: 'print', mirror: mirror, eyeOpen: 0, pupil: 1, mouthOpen: 0, ink: 0 }); }

  MK.scene({
    id: 's05', order: 50, len: 2.0, title: 'Басу', hold: 'press',
    overlay: [
      { type: 'caption', at: [.82, .98], x: 90, y: 22, w: 600, side: 'l', rot: 1, text: 'Қағаз көтерілгенде, баспа тыныс алды.' },
      { type: 'sfx', at: [.1, .3], x: 260, y: 1340, size: 110, rot: -5, font: 'brush', color: 'paper', fx: 'wobble', text: '펄럭', gloss: 'жалп' }
    ],
    init: function (st) { st.doneT = null; st.hv = 0; },
    update: function (ctx) {
      var st = ctx.state, p = ctx.p, auto = MK.range(p, .5, .8);
      if (p < .3) { MK.holdReset(st); st.hv = 0; st.doneT = null; return; }
      var hm = MK.holdMeter(st, ctx.input, ctx.dt, { rise: 1 / 2.2, fall: 1 / .9 });
      st.hv = hm.completed ? 1 : Math.max(hm.value, auto);
      var done = st.hv >= 1;
      if (done && st.doneT == null) st.doneT = ctx.t; else if (!done) st.doneT = null;
    },
    draw: function (ctx) {
      var P = ctx.P, p = ctx.p, t = ctx.t, b = ctx.view.bounds, st = ctx.state, art = MK.art;
      var B = MK.blockArt, hv = p >= .3 ? st.hv : 0, since = st.doneT == null ? 0 : Math.max(0, t - st.doneT);
      var pe = p >= .3 ? clamp(Math.max(MK.range(p, .8, .88), since / 1.3), 0, 1) : 0;
      var ho = MK.range(p, .9, 1);
      B.desk(P);
      B.drawBlock(P, { carve: 1, inked: 1, mask: null });

      /* ---------- handoff: printed sheet returns, grows to fill bounds ---------- */
      if (ho > 0) {
        var e1 = E.outCubic(MK.range(ho, 0, .4)), e2 = E.inOutCubic(MK.range(ho, .35, 1));
        var tg = { x: b.x0 - 60, y: b.y0 - 60, w: b.x1 - b.x0 + 120, h: b.y1 - b.y0 + 120 };
        var rc = { x: lerp(RECT.x, tg.x, e2), y: lerp(RECT.y, tg.y, e2), w: lerp(RECT.w, tg.w, e2), h: lerp(RECT.h, tg.h, e2) };
        P.push(); P.translate(CX - 1500 * (1 - e1), CY - 1400 * (1 - e1)); P.rotate(-.35 * (1 - e1)); P.translate(-CX, -CY);
        art.sheet(P, rc, { shadow: true, t: lerp(.07, 0, e2), sh: 1 - e2 * .5 });
        printTiger(P, false, lerp(700, 760, e2), lerp(700, 660, e2));
        P.pop();
        ctx.fx.misreg = [1 * e2, .6 * e2];   /* s06 opens with misreg [1,.6] */
        return;
      }

      /* ---------- drop ---------- */
      var k = MK.range(p, 0, .25), dy = -1500 * (1 - E.outQuad(k)) + 12 * Math.sin(Math.PI * MK.range(k, .8, 1));
      var rot = .06 * Math.sin(k * TAU * 2.5) * (1 - k), sc = lerp(1.05, 1, k);
      if (k < 1) {   // soft shadow on the block, shrinking as the sheet lands
        var sa = E.smoothstep(MK.range(k, 0, .4));
        P.alpha(sa, function () { P.blur(10 + 26 * (1 - k), function () { P.toneOnly(function () { P.rect(RECT.x + 30 * (1 - k) + 10, RECT.y + 40 * (1 - k) + 14, RECT.w, RECT.h, { c: 'ink', t: lerp(.5, .2, k) }); }); }); });
      }
      P.push(); P.translate(CX, CY + dy); P.scale(sc); P.rotate(rot); P.translate(-CX, -CY);
      var peeling = pe > 0;
      var maskPath = null, u = clamp(hv, 0, 1);
      if (u > 0) {
        maskPath = new Path2D(); var n = Math.max(2, Math.ceil(120 * u)), i;
        for (i = 0; i <= n; i++) { var q = rubPoint(u * i / n); maskPath.moveTo(q[0] + RUB_R, q[1]); maskPath.arc(q[0], q[1], RUB_R, 0, TAU); }
      }
      function topSide() {
        var pts = art.sheet(P, RECT, { shadow: false });
        var ramp = MK.range(p, .2, .3);
        if (ramp > 0) P.alpha(.15 * ramp, function () { printTiger(P, true); });
        if (maskPath) P.clip(maskPath, function () { printTiger(P, true); });
        return pts;
      }
      var sheetPts = null;
      if (!peeling) topSide();
      else {
        var c = lerp(C0, C1, E.inOutQuad(pe)), Hm = halfPoly(c, -1), Hp = halfPoly(c, 1);
        var a = 1 - 2 * NX * NX, bb = -2 * NX * NY, d = 1 - 2 * NY * NY, e = 2 * c * NX, f = 2 * c * NY;
        /* cast shadow on the revealed block beside the fold */
        P.clip(Hp, function () { P.toneOnly(function () { P.poly(halfPoly(c, 1, 150), { c: 'ink', t: P.lin(c * NX, c * NY, (c + 150) * NX, (c + 150) * NY, [[0, .55], [1, 0]]), a: 0 }); }); });
        /* flat part */
        P.clip(Hm, function () { sheetPts = topSide(); });
        /* flap: reflection of the lifted part, showing the printed underside */
        if (pe < 1) {
          P.push(); P.translate(14, 20); P.transform(a, bb, bb, d, e, f);
          P.blur(8, function () { P.clip(Hp, function () { P.toneOnly(function () { P.poly(RECT_PTS, { c: 'ink', t: .55 }); }); }); });
          P.pop();
          P.push(); P.transform(a, bb, bb, d, e, f);
          P.clip(Hp, function () {
            var pts = art.sheet(P, RECT, { shadow: false, t: .1 });
            printTiger(P, true);
            P.clip(pts, function () { P.toneOnly(function () { P.poly(halfPoly(c, 1, 150), { c: 'ink', t: P.lin(c * NX, c * NY, (c + 150) * NX, (c + 150) * NY, [[0, .6], [1, 0]]), a: PHI * 180 / Math.PI }); }); });
          });
          P.pop();
          /* fold crease */
          var tx = -NY, ty = NX;
          P.clip(RECT_PTS, function () { P.stroke([[c * NX + tx * 1600, c * NY + ty * 1600], [c * NX - tx * 1600, c * NY - ty * 1600]], { w: 2.6, c: 'ink' }); });
          if (pe > .02) ctx.sfx('사락', { key: 'peel', x: 700, y: 1340, size: 110, rot: 4, font: 'brush', color: 'paper', fx: 'wobble', gloss: 'сыбдыр', life: 1.2 });
        }
      }
      /* pad */
      if (p >= .27 && p < .9) {
        var pu = clamp(hv, 0, 1), pp = rubPoint(pu), pp2 = rubPoint(Math.min(1, pu + .004)), pr = Math.atan2(-(pp2[1] - pp[1]), -(pp2[0] - pp[0]));
        if (pu <= 0) pr = Math.PI * .85;
        var enter = 360 * (1 - E.outCubic(MK.range(p, .27, .32))), leave = E.inQuad(MK.range(since, .05, .55)) * 800;
        if (pe < 1 || since < .6) art.pad(P, pp[0] + leave + 6 * Math.sin(t * 13) * (st.hv < 1 && ctx.input.holding ? 1 : 0), pp[1] - enter - leave * .4, PAD_R, pr);
      }
      P.pop();

      /* ---------- hold UI + rubbing sfx ---------- */
      if (p >= .3 && hv < 1) {
        ctx.ui.hold = { label: '꾹 · БАСЫП ТҰР', progress: hv };
        if (ctx.input.holding && hv > 0) {
          var pr2 = rubPoint(hv), kk = Math.floor(hv * 2.2 / .6);
          ctx.sfx('슥슥', { key: 'rub' + kk, x: clamp(pr2[0] + 120, 220, 800), y: clamp(pr2[1] - 170, 250, 1150), size: 96, rot: (kk % 2 ? 6 : -6), font: 'brush', color: 'paper', fx: 'wobble', gloss: 'ысқ', life: .8 });
        }
      }
    }
  });
})();

<script>/* scenes/t02_eaves.js */

/* t06 «Тырнақ» — four claw slashes tear diagonally across the screen, then peel away over the bell pavilion */
(function () {

  var MK = window.MK, clamp = MK.clamp, E = MK.ease, range = MK.range;

  var CX = 500, CY = 700, HL = 1350;                     /* centre, half length */

  var SPEED = null;

  function buildSpeed() {
    var r = MK.rng(61), i, j; SPEED = [];

      var y = r.range(150, 1250), x = r.range(-300, 1000), len = r.range(260, 760), segs = [], x0 = x;

    }

    id: 't06', order: 65, len: .8, from: 's06', to: 's07', kind: 'custom',

    var v = MK.view, k = Math.floor(t * 24), sh = reduced ? 0 : (fx.shake || 0);
    var u = {
      time: t, grain: fx.grain == null ? 1 : fx.grain,
      shake: [(MK.hash(k * 1.31) - .5) * 2 * sh, (MK.hash(k * 2.17 + 5) - .5) * 2 * sh],
      misreg: fx.misreg || [0, 0], ripple: [0, 0, -1e4, 0], rippleW: 24, flash: [0, 0, 0, 0]
    };
    if (fx.ripple) {
      var r = fx.ripple; u.ripple = [v.ox + r.x * v.s, v.oy + r.y * v.s, r.r * v.s, reduced ? 0 : (r.amp || 0)]; u.rippleW = r.w || 24;
    }
    if (fx.flash && !reduced) { var c = typeof fx.flash.c === 'string' ? MK.PAL[fx.flash.c] : fx.flash.c; c = c || MK.PAL.paper; u.flash = [c[0] / 255, c[1] / 255, c[2] / 255, clamp(fx.flash.a || 0, 0, 1)]; }
    return u;
  }

  function renderFrame(sVH, t, dt, snap) {
    var fx = { shake: 0, misreg: [0, 0], ripple: null, flash: null, grain: 1 }, ui = { hold: null };
    var base = { t: t, dt: dt, input: MK.input, fx: fx, ui: ui, view: MK.view, P: P, p: 0 }, active = [];
    P.begin();
    try {
      if (ART) MK.artSheet(base); else active = TL.frame(sVH, base);
    } catch (e) { MK.err(e, 'frame'); }
    MK.input.holdActive = !!ui.hold;
    if (MK.GL.ok) { try { MK.GL.draw(P, uniforms(fx, t)); } catch (e) { MK.err(e, 'gl'); } }
    try { MK.overlay.update({ active: active, t: t, dt: dt, ui: ui, flash: fx.flash, snap: snap }); } catch (e) { MK.err(e, 'overlay'); }
    MK.input.endFrame();
    return active;
  }

  var bootP = (async function boot() {
    MK.overlay.init();
    TL.build();
    MK.overlay.registerAll(TL.scenes()); MK.overlay.setSegments(TL.segments, TL.total);
    try { MK.GL.init(canvas, CAPTURE); } catch (e) { MK.err(e, 'gl-init'); }
    resize(); MK.overlay.loaderProgress(.25);
    try {
      await Promise.race([Promise.all(FONTS.map(function (f) { return document.fonts.load(f, '목판MOKPANАБҚ가1'); })).then(function () { return document.fonts.ready; }), new Promise(function (r) { setTimeout(r, 6000); })]);
    } catch (e) { MK.err(e, 'fonts'); }
    MK.overlay.loaderProgress(.8);
    if (ART) { document.body.classList.add('art'); }
    S.target = S.s = clamp(window.scrollY / window.innerHeight, 0, TL.total);
    renderFrame(S.s, 0, 0, true);
    MK.overlay.loaderProgress(1); MK.overlay.loaderDone();
    S.ready = true;
  })();

  window.addEventListener('resize', function () { if (S.ready) { resize(); if (CAPTURE) return; } });

  if (CAPTURE) {
    var prevT = 0;
    window.__mk = {
      ready: bootP,
      segments: null, total: 0,
      render: function (sVH, tSec, input) {
        if (input) MK.input.set(input); else MK.input.set({ holding: false });
        var dt = clamp(tSec - prevT, 0, .1); prevT = tSec;
        return renderFrame(sVH, tSec, dt, true);
      }
    };
    bootP.then(function () {
      window.__mk.segments = TL.segments.map(function (g) { return { id: g.id, kind: g.kind, start: g.start, len: g.len, hold: g.hold, title: g.title }; });
      window.__mk.total = TL.total;
    });
  } else {
    var t0 = performance.now() / 1000, last = t0, slowN = 0;
    var loop = function (now) {
      requestAnimationFrame(loop);
      if (!S.ready) return;
      var tt = now / 1000, dt = clamp(tt - last, 0, .1), raw = tt - last; last = tt;
      S.target = clamp(window.scrollY / window.innerHeight, 0, TL.total);
      S.s += (S.target - S.s) * (1 - Math.exp(-7 * dt));
      if (Math.abs(S.target - S.s) < .0004) S.s = S.target;
      renderFrame(S.s, tt - t0, dt, false);
      if (S.q > .75) { slowN = raw > .024 ? slowN + 1 : 0; if (slowN >= 20) { S.q = .75; resize(); } }
    };
    requestAnimationFrame(loop);
    window.__mkState = S;
  }
  document.addEventListener('contextmenu', function (e) { if (e.target.closest && e.target.closest('.seal')) e.preventDefault(); });

  /* ================= art sheet (?art=1) ================= */
  MK.artSheet = function (ctx) {
    var t = 1.0 + (CAPTURE ? 0 : ctx.t), A = MK.art, b = ctx.view.bounds;
    P.cover({ c: 'paper', t: 0 });
    if (qs.get('zoom') === 'tiger') {
      var Z = [{ mode: 'print', eyeOpen: 1, ink: .4, pupil: .5 }, { mode: 'alive', eyeOpen: 1, pupil: .2, mouthOpen: 1 }, { mode: 'block', carve: .8, inked: .5 }, { mode: 'sky', eyeOpen: 1, pupil: .3 }];
      Z.forEach(function (z, i) { var cx = 250 + (i % 2) * 500, cy = 350 + Math.floor(i / 2) * 700;
        if (z.mode === 'sky') P.rect(cx - 250, cy - 350, 500, 700, { c: 'red', t: .5, a: 90 });
        A.tiger(P, cx, cy, 440, z); });
      return;
    }
    var CW = 250, CH = 232, X0 = 0, Y0 = 18, cells = [];
    function cell(c, r, label, fn, o) {
      o = o || {}; var x = X0 + c * CW, y = Y0 + r * CH, w = (o.w || 1) * CW, h = CH;
      P.clip([[x + 2, y + 2], [x + w - 2, y + 2], [x + w - 2, y + h - 2], [x + 2, y + h - 2]], function () {
        if (o.bg) P.rect(x, y, w, h, o.bg);
        fn(x + w / 2, y + h / 2 + 4, x, y, w, h);
      });
      P.stroke([[x + 2, y + 2], [x + w - 2, y + 2], [x + w - 2, y + h - 2], [x + 2, y + h - 2]], { w: 2, c: 'ink', closed: true });
      P.text(label, x + 8, y + 16, { font: 'IBM Plex Mono', weight: 500, size: 12 }, { c: o.bg ? 'paper' : 'ink', t: 0 });
    }
    var T = function (st, o) { return function (cx, cy) { var r = A.tiger(P, cx, cy + 6, 196, st); if (r && o) A.chisel(P, r.x, r.y, r.ang, { size: .5 }); }; };
    cell(0, 0, 'tiger block carve .55', T({ mode: 'block', carve: .55 }, true));
    cell(1, 0, 'block mirror inked .6', T({ mode: 'block', carve: 1, inked: .6, mirror: true }));
    cell(2, 0, 'print closed', T({ mode: 'print', eyeOpen: 0 }));
    cell(3, 0, 'print->alive ink .5 open', T({ mode: 'print', eyeOpen: 1, ink: .5, pupil: .6 }));
    cell(0, 1, 'alive open', T({ mode: 'alive', eyeOpen: 1, pupil: .25 }));
    cell(1, 1, 'alive mouth open', T({ mode: 'alive', eyeOpen: 1, pupil: .15, mouthOpen: 1 }));
    cell(2, 1, 'alive closed', T({ mode: 'alive', eyeOpen: 0 }));
    cell(3, 1, 'sky', T({ mode: 'sky', eyeOpen: 1, pupil: .3 }), { bg: { c: 'red', t: P.lin(0, 0, 0, 1, [[0, .5], [1, .5]]), a: 90 } });
    cell(0, 2, 'carver stand', function (cx, cy, x, y, w, h) { A.carver(P, cx, y + h - 12, 200, { t: t }); });
    cell(1, 2, 'carver seat', function (cx, cy, x, y, w, h) { A.carver(P, cx, y + h - 6, 180, { pose: 'seat', arm: .25 + t * .1, t: t }); });
    cell(2, 2, 'shadow (blurred)', function (cx, cy, x, y, w, h) {
      P.blur(5, function () { A.carver(P, cx, y + h - 6, 180, { pose: 'seat', arm: .3, shadow: true, t: t }); });
    });
    cell(3, 2, 'seal + chisel', function (cx, cy) {
      A.seal(P, cx - 40, cy - 20, 90, '각수', { seed: 3 }); A.chisel(P, cx + 70, cy + 50, -2.4, { size: .6 });
      P.push(); P.translate(cx - 30, cy + 70); P.rotate(-.07); A.seal(P, 0, 0, 44, '목판 1화', { press: 1 }); P.pop();
    });
    cell(0, 3, 'eave + tiles + rafters + chime', function (cx, cy, x, y, w, h) {
      A.eave(P, x - 20, x + w * 2 + 20, y + 88, 52, { chime: .35 * Math.sin(t * 3.77), chimeX: x + w * 2 - 70, rafter: 100, bottom: y + h, chimeSize: .45 });
    }, { w: 2 });
    cell(2, 3, 'ink brush', function (cx, cy) { A.inkBrush(P, cx - 20, cy + 62, 90, .35, { wet: .8 }); A.inkBrush(P, cx + 48, cy + 90, 50, -.5, { wet: .4, tip: 'red', seed: 8 }); });
    cell(3, 3, 'pad + sheet', function (cx, cy) { A.sheet(P, { x: cx - 100, y: cy - 90, w: 110, h: 150 }, { rot: -.12 }); A.pad(P, cx + 32, cy + 20, 40, -.7); });
    cell(0, 4, 'tapered strokes', function (cx, cy) {
      P.taper([[cx - 100, cy - 40], [cx - 40, cy - 70], [cx + 20, cy - 30], [cx + 100, cy - 60]], [26, 1], { c: 'ink', t: 0 });
      P.taper([[cx - 100, cy + 10], [cx - 20, cy + 40], [cx + 100, cy]], function (u) { return 6 + 24 * Math.sin(Math.PI * u); }, { c: 'red', t: 0, stroke: { w: 2, c: 'ink' } });
      P.taper([[cx - 100, cy + 70], [cx, cy + 50], [cx + 100, cy + 76]], [18, 18], { c: 'paper', t: .6, a: 60, stroke: { w: 3, c: 'ink' } });
    });
    cell(1, 4, 'crack + ribbon', function (cx, cy, x, y, w, h) {
      var c = MK.fx.crackPath(4, cx - 50, y + 30, y + h - 20, 26); P.stroke(c, { w: 5, c: 'ink' });
      var rb = MK.fx.ribbon([[cx + 10, y + 40], [cx + 40, y + 100], [cx + 60, y + 190]], 12, t * 8.8, 18, 5);
      P.taper(rb, [20, 10], { c: 'blue', t: 0, stroke: { w: 2.5, c: 'ink' } });
    });
    cell(2, 4, 'chips / splinters / drops', function (cx, cy) {
      MK.fx.chips(P, { seed: 3, n: 14, x: cx - 60, y: cy + 60, tau: .35, dir: -1.57, spread: 2, speed: 300, g: 800, life: 1, size: 12 });
      MK.fx.splinters(P, { seed: 5, n: 10, x: cx + 50, y: cy + 60, tau: .3, dir: -1.57, spread: 2.4, speed: 330, g: 700, life: 1, size: 12 });
      MK.fx.droplets(P, { seed: 7, n: 16, x: cx, y: cy, tau: .2, dir: 0, spread: 6.28, speed: 260, g: 400, life: 1, size: 12 });
    });
    cell(3, 4, 'tone styles', function (cx, cy, x, y, w, h) {
      ['line', 'grain', 'cross', 'dots'].forEach(function (hh, i) {
        [.12, .4, .85].forEach(function (tt, j) { P.rect(x + 12 + j * 70, y + 26 + i * 48, 62, 42, { c: 'paper', t: tt, h: hh, a: i === 0 ? 0 : 20, stroke: { w: 2, c: 'ink' } }); });
      });
    });
    cell(0, 5, 'palette', function (cx, cy, x, y) {
      ['red', 'ink', 'paper', 'blue', 'gold'].forEach(function (n, i) { P.rect(x + 14 + i * 46, y + 40, 40, 100, { c: n, t: 0, stroke: { w: 2, c: 'ink' } }); });
      P.rect(x + 14, y + 150, 220, 60, { c: 'red', t: P.lin(x + 14, 0, x + 234, 0, [[0, 0], [1, 1]]), a: 90 });
    });
    cell(1, 5, 'tone gradient a=45', function (cx, cy, x, y, w, h) { P.rect(x + 10, y + 26, w - 20, h - 36, { c: 'paper', t: P.lin(0, y, 0, y + h, [[0, 0], [1, 1]]), a: 45 }); });
    cell(2, 5, 'blue/gold + eave rafter', function (cx, cy, x, y, w, h) {
      P.circle(cx - 40, cy, 36, { c: 'gold', t: P.rad(cx - 40, cy, 8, 36, [[0, 0], [1, .6]]), a: 90, stroke: { w: 3, c: 'ink' } });
      P.circle(cx + 40, cy, 36, { c: 'blue', t: P.rad(cx + 40, cy, 8, 36, [[0, 0], [1, .6]]), a: 90, stroke: { w: 3, c: 'ink' } });
    });
    cell(3, 5, 'ridge silhouette', function (cx, cy, x, y, w, h) { A.ridge(P, x + 20, x + w - 20, y + h - 60, 90, 3, { c: 'ink', t: 0 }); }, {});
  };
})();
