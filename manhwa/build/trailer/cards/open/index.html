<!doctype html>
<html lang="kk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=720, height=1280" />
<title>MOKPAN opening card</title>
<script src="gsap.min.js"></script>
<style>
@font-face{font-family:'Black Han Sans';src:url('fonts/BlackHanSans-Regular.woff2') format('woff2');font-display:block}
@font-face{font-family:'Cormorant Garamond';font-weight:700;src:url('fonts/CormorantGaramond-Bold.woff2') format('woff2');font-display:block}
@font-face{font-family:'Cormorant Garamond';font-weight:600;src:url('fonts/CormorantGaramond-SemiBold.woff2') format('woff2');font-display:block}
@font-face{font-family:'IBM Plex Mono';font-weight:400;src:url('fonts/IBMPlexMono-Regular.woff2') format('woff2');font-display:block}
@font-face{font-family:'IBM Plex Mono';font-weight:500;src:url('fonts/IBMPlexMono-Medium.woff2') format('woff2');font-display:block}
html,body{margin:0;background:#EEE6D6}
#root{position:relative;width:720px;height:1280px;overflow:hidden;background:#EEE6D6}
.clip{position:absolute;inset:0}
#paper{background:radial-gradient(ellipse at 50% 45%,#F3ECDC 0%,#EEE6D6 55%,#DDD2BB 100%)}
#paper svg{position:absolute;inset:0;width:720px;height:1280px;opacity:.55;mix-blend-mode:multiply}
#stage{position:absolute;inset:0}
#seal{position:absolute;left:260px;top:360px;width:200px;height:200px;background:#CF2A1B;color:#EEE6D6;
  font:400 78px/84px 'Black Han Sans',sans-serif;text-align:center;display:flex;flex-direction:column;justify-content:center;
  letter-spacing:2px;transform-origin:50% 50%;filter:url(#rough);opacity:0}
#seal span{display:block}
#speck{position:absolute;left:0;top:0;width:720px;height:1280px;pointer-events:none}
#title{position:absolute;left:0;width:720px;top:640px;text-align:center;font:700 150px/1 'Cormorant Garamond',serif;letter-spacing:10px;color:#15110F;opacity:0}
#sub{position:absolute;left:0;width:720px;top:830px;text-align:center;font:400 27px/1.4 'IBM Plex Mono',monospace;color:#15110F;opacity:0;letter-spacing:.5px}
#rule{position:absolute;left:260px;width:200px;top:800px;height:3px;background:#CF2A1B;}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
 <filter id="rough" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="7"/></filter>
</defs></svg>
<div id="root" data-composition-id="open" data-width="720" data-height="1280" data-duration="3" data-fps="30">
  <div id="paper" class="clip" data-start="0" data-duration="3" data-track-index="0">
    <svg><filter id="fib"><feTurbulence type="fractalNoise" baseFrequency="0.9 0.035" numOctaves="4" seed="3"/><feColorMatrix values="0 0 0 0 .45  0 0 0 0 .38  0 0 0 0 .27  0 0 0 .55 -.18"/></filter><rect width="720" height="1280" filter="url(#fib)"/></svg>
  </div>
  <div id="stage" class="clip" data-start="0" data-duration="3" data-track-index="1">
    <svg id="speck" viewBox="0 0 720 1280"></svg>
    <div id="seal"><span>목</span><span>판</span></div>
    <div id="title">MOKPAN</div>
    <div id="rule"></div>
    <div id="sub">Қызыл айдың оюшысы · 1-бөлім</div>
  </div>
</div>
<script>
window.__timelines = window.__timelines || {};
// deterministic ink speckle around the seal (seeded LCG)
(function(){var s=20240611,r=function(){s=(s*1664525+1013904223)>>>0;return s/4294967296};
 var NS='http://www.w3.org/2000/svg',g=document.getElementById('speck'),cx=360,cy=460,out=[];
 for(var i=0;i<46;i++){var a=r()*6.2832,d=108+Math.pow(r(),1.8)*90,c=document.createElementNS(NS,'circle');
  c.setAttribute('cx',cx+Math.cos(a)*d);c.setAttribute('cy',cy+Math.sin(a)*d*.95);c.setAttribute('r',(1+r()*4.2).toFixed(2));c.setAttribute('fill','#CF2A1B');c.setAttribute('opacity','0');g.appendChild(c);out.push({el:c,a:a,d:d})}
 window.__speck=out;})();
var tl = gsap.timeline({ paused: true });
var HIT = 0.55;    // seal lands (keep in sync with OPEN_STAMP in build/sound/score.py)
tl.set('#seal',{rotation:-10,scale:1.6,opacity:0},0);
tl.to('#seal',{opacity:1,duration:0.12,ease:'none'},HIT-0.3);
tl.to('#seal',{scale:1,rotation:-4,duration:0.3,ease:'power3.in'},HIT-0.3);
tl.to('#stage',{y:7,duration:0.05,ease:'power2.out'},HIT);
tl.to('#stage',{y:0,duration:0.35,ease:'elastic.out(1,0.35)'},HIT+0.05);
tl.to('#seal',{scale:1.025,duration:0.08,ease:'power2.out'},HIT).to('#seal',{scale:1,duration:0.25,ease:'power2.out'},HIT+0.08);
window.__speck.forEach(function(o,i){
  var k=i/46; tl.fromTo(o.el,{opacity:0,attr:{cx:360+Math.cos(o.a)*100,cy:460+Math.sin(o.a)*95}},{opacity:0.55+0.4*(1-k),attr:{cx:360+Math.cos(o.a)*o.d,cy:460+Math.sin(o.a)*o.d*.95},duration:0.14,ease:'power3.out'},HIT+0.005*(i%7));
});
gsap.set('#rule',{scaleX:0,transformOrigin:'0% 50%'});
tl.to('#rule',{scaleX:1,duration:0.6,ease:'power2.out'},1.0);
tl.fromTo('#title',{opacity:0,y:26},{opacity:1,y:0,duration:0.7,ease:'power2.out'},1.1);
tl.fromTo('#sub',{opacity:0,y:14},{opacity:.88,y:0,duration:0.6,ease:'power2.out'},1.65);
window.__timelines["open"] = tl;
</script>
</body>
</html>
