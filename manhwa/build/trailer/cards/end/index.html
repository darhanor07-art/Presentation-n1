<!doctype html>
<html lang="kk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=720, height=1280" />
<title>MOKPAN end card</title>
<script src="gsap.min.js"></script>
<style>
@font-face{font-family:'Black Han Sans';src:url('fonts/BlackHanSans-Regular.woff2') format('woff2');font-display:block}
@font-face{font-family:'Cormorant Garamond';font-weight:700;src:url('fonts/CormorantGaramond-Bold.woff2') format('woff2');font-display:block}
@font-face{font-family:'Cormorant Garamond';font-weight:600;src:url('fonts/CormorantGaramond-SemiBold.woff2') format('woff2');font-display:block}
@font-face{font-family:'IBM Plex Mono';font-weight:400;src:url('fonts/IBMPlexMono-Regular.woff2') format('woff2');font-display:block}
@font-face{font-family:'IBM Plex Mono';font-weight:500;src:url('fonts/IBMPlexMono-Medium.woff2') format('woff2');font-display:block}
html,body{margin:0;background:#15110F}
#root{position:relative;width:720px;height:1280px;overflow:hidden;background:#15110F}
.clip{position:absolute;inset:0}
#ink{background:radial-gradient(ellipse at 50% 50%,#211B17 0%,#15110F 60%,#0C0908 100%)}
#ink svg{position:absolute;inset:0;width:720px;height:1280px;opacity:.5;mix-blend-mode:screen}
#stage{position:absolute;inset:0}
#cont{position:absolute;left:0;width:720px;top:560px;text-align:center;font:700 74px/1.1 'Cormorant Garamond',serif;color:#EEE6D6;letter-spacing:2px;opacity:0}
#seal{position:absolute;left:310px;top:760px;width:100px;height:100px;background:#CF2A1B;color:#EEE6D6;font:400 34px/38px 'Black Han Sans',sans-serif;
  text-align:center;display:flex;flex-direction:column;justify-content:center;filter:url(#rough);opacity:0;transform-origin:50% 50%}
#seal span{display:block}
#line{position:absolute;left:300px;width:120px;top:700px;height:2px;background:#EEE6D6;opacity:.35;}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
 <filter id="rough" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.07" numOctaves="3" seed="11" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="4"/></filter>
</defs></svg>
<div id="root" data-composition-id="end" data-width="720" data-height="1280" data-duration="3" data-fps="30">
  <div id="ink" class="clip" data-start="0" data-duration="3" data-track-index="0">
    <svg><filter id="g"><feTurbulence type="fractalNoise" baseFrequency="0.8 0.05" numOctaves="3" seed="9"/><feColorMatrix values="0 0 0 0 .35  0 0 0 0 .3  0 0 0 0 .25  0 0 0 .4 -.14"/></filter><rect width="720" height="1280" filter="url(#g)"/></svg>
  </div>
  <div id="stage" class="clip" data-start="0" data-duration="3" data-track-index="1">
    <div id="cont">Жалғасы бар…</div>
    <div id="line"></div>
    <div id="seal"><span>1화</span><span>끝</span></div>
  </div>
</div>
<script>
window.__timelines = window.__timelines || {};
var tl = gsap.timeline({ paused: true });
var HIT = 1.5;     // seal lands (keep in sync with END_STAMP in build/sound/score.py)
tl.fromTo('#cont',{opacity:0,y:16},{opacity:1,y:0,duration:0.9,ease:'power2.out'},0.35);
gsap.set('#line',{scaleX:0,transformOrigin:'50% 50%'});
tl.to('#line',{scaleX:1,duration:0.6,ease:'power2.out'},1.0);
tl.set('#seal',{rotation:-8,scale:1.5,opacity:0},0);
tl.to('#seal',{opacity:1,duration:0.1,ease:'none'},HIT-0.25);
tl.to('#seal',{scale:1,rotation:-3,duration:0.25,ease:'power3.in'},HIT-0.25);
tl.to('#seal',{scale:1.04,duration:0.07,ease:'power2.out'},HIT).to('#seal',{scale:1,duration:0.25,ease:'power2.out'},HIT+0.07);
window.__timelines["end"] = tl;
</script>
</body>
</html>
